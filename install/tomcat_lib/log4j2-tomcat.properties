# Logging configuration
# Both tomcat and CWS use Log4J2 backend

# all stdout goes to catalina.out at startup
# CWS & other packages log to cws.log after startup

# 'status' refers to log messages from Log4j2 itself
status = warn
# how often to check this configuration file for changes
monitorInterval = 30

# file appender
# logs to cws.log, rotating to cws.yyyy-MM-dd.out every day
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${sys:catalina.base}/logs/cws.log
appender.rolling.filePattern = ${sys:catalina.base}/logs/cws.%d{yyyy-MM-dd}.log
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{ISO8601}{UTC} %-5p [%20.20t] %30.30c(%4.4L) - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.strategy.type = DefaultRolloverStrategy

# Artemis specific log file appender
# logs to artemis.log in the Artemis log directory
appender.artemis.type = RollingFile
appender.artemis.name = ArtemisFile
appender.artemis.fileName = ${sys:catalina.base}/server/artemis/log/artemis.log
appender.artemis.filePattern = ${sys:catalina.base}/server/artemis/log/artemis.%d{yyyy-MM-dd}.log
appender.artemis.layout.type = PatternLayout
appender.artemis.layout.pattern = %d{ISO8601}{UTC} %-5p [%20.20t] %30.30c(%4.4L) - %m%n
appender.artemis.policies.type = Policies
appender.artemis.policies.time.type = TimeBasedTriggeringPolicy
appender.artemis.policies.time.interval = 1
appender.artemis.policies.time.modulate = true
appender.artemis.strategy.type = DefaultRolloverStrategy

### LOG RETENTION SETTINGS ###
# to keep all logs (default), use:
appender.rolling.strategy.fileIndex = nomax
# to delete old logs, comment the above line and replace with below to keep 30 days of logs. update per your needs.
#appender.rolling.strategy.max = 30

# Uncomment if you want to keep logging to catalina.out after Log4j2 takes over.
# You will need to externally configure rotation on catalina.out if you do this, otherwise it will continue to grow

appender.CONSOLE.type = Console
appender.CONSOLE.name = STDOUT
appender.CONSOLE.layout.type = PatternLayout
appender.CONSOLE.layout.pattern = %d{ISO8601}{UTC} %-5p [%20.20t] %30.30c(%4.4L) - %m%n

## Configure which loggers log to which appenders

# Camunda
logger.camunda.name = org.camunda
logger.camunda.level = info
logger.camunda.additivity = false
logger.camunda.appenderRef.stdout.ref = RollingFile

# Camunda Engine
logger.camundaEngine.name = org.camunda.bpmn.engine
logger.camundaEngine.level = warn
logger.camundaEngine.additivity = false
logger.camundaEngine.appenderRef.stdout.ref = RollingFile

# Spring Framework
logger.springframework.name = org.springframework
logger.springframework.level = info
logger.springframework.additivity = false
logger.springframework.appenderRef.stdout.ref = RollingFile

# CWS
logger.cws.name = jpl.cws
logger.cws.level = debug
logger.cws.additivity = false
logger.cws.appenderRef.stdout.ref = RollingFile

# Jakarta
logger.jakarta.name = jakarta.activation.level
logger.jakarta.level = info
logger.jakarta.additivity = false
logger.jakarta.appenderRef.stdout.ref = RollingFile

# ActiveMQ Artemis - Focused Debug Logging for Startup Issues
logger.activemq.name = org.apache.activemq
logger.activemq.level = warn
logger.activemq.additivity = false
logger.activemq.appenderRef.stdout.ref = RollingFile
logger.activemq.appenderRef.artemis.ref = ArtemisFile

# ActiveMQ Artemis Core - Essential for startup debugging
logger.activemqCore.name = org.apache.activemq.artemis.core
logger.activemqCore.level = info
logger.activemqCore.additivity = false
logger.activemqCore.appenderRef.stdout.ref = RollingFile
logger.activemqCore.appenderRef.artemis.ref = ArtemisFile

# ActiveMQ Artemis Server - Critical for startup issues
logger.activemqServer.name = org.apache.activemq.artemis.core.server
logger.activemqServer.level = info
logger.activemqServer.additivity = false
logger.activemqServer.appenderRef.stdout.ref = RollingFile
logger.activemqServer.appenderRef.artemis.ref = ArtemisFile

# ActiveMQ Artemis Embedded - Most important for startup debugging
logger.activemqEmbedded.name = org.apache.activemq.artemis.core.server.embedded
logger.activemqEmbedded.level = debug
logger.activemqEmbedded.additivity = false
logger.activemqEmbedded.appenderRef.stdout.ref = RollingFile
logger.activemqEmbedded.appenderRef.artemis.ref = ArtemisFile
logger.activemqEmbedded.appenderRef.console.ref = STDOUT

# ActiveMQ Artemis JMS - Keep at info level
logger.activemqJms.name = org.apache.activemq.artemis.jms
logger.activemqJms.level = info
logger.activemqJms.additivity = false
logger.activemqJms.appenderRef.stdout.ref = RollingFile

# ActiveMQ Artemis Transport - Keep at info level
logger.activemqTransport.name = org.apache.activemq.artemis.core.remoting
logger.activemqTransport.level = info
logger.activemqTransport.additivity = false
logger.activemqTransport.appenderRef.stdout.ref = RollingFile

# ActiveMQ Artemis Netty - Keep at info level
logger.activemqNetty.name = org.apache.activemq.artemis.core.remoting.impl.netty
logger.activemqNetty.level = info
logger.activemqNetty.additivity = false
logger.activemqNetty.appenderRef.stdout.ref = RollingFile

# ActiveMQ Artemis Journal - Keep at info level
logger.activemqJournal.name = org.apache.activemq.artemis.core.journal
logger.activemqJournal.level = info
logger.activemqJournal.additivity = false
logger.activemqJournal.appenderRef.stdout.ref = RollingFile

# ActiveMQ Artemis Security - Keep at info level
logger.activemqSecurity.name = org.apache.activemq.artemis.core.security
logger.activemqSecurity.level = info
logger.activemqSecurity.additivity = false
logger.activemqSecurity.appenderRef.stdout.ref = RollingFile

# ActiveMQ Artemis Management - Keep at info level
logger.activemqManagement.name = org.apache.activemq.artemis.core.management
logger.activemqManagement.level = info
logger.activemqManagement.additivity = false
logger.activemqManagement.appenderRef.stdout.ref = RollingFile

# ActiveMQ Artemis Plugin - Keep at info level
logger.activemqPlugin.name = org.apache.activemq.artemis.core.server.plugin
logger.activemqPlugin.level = info
logger.activemqPlugin.additivity = false
logger.activemqPlugin.appenderRef.stdout.ref = RollingFile

# ActiveMQ Artemis Exceptions - Critical for startup debugging
logger.activemqExceptions.name = org.apache.activemq.artemis
logger.activemqExceptions.level = error
logger.activemqExceptions.additivity = false
logger.activemqExceptions.appenderRef.stdout.ref = RollingFile
logger.activemqExceptions.appenderRef.artemis.ref = ArtemisFile
logger.activemqExceptions.appenderRef.console.ref = STDOUT

# ROOT
rootLogger.level = info
rootLogger.appenderRef.rolling.ref = RollingFile